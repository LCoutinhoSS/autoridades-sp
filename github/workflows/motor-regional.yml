name: Motor Regional — Inventario/Previas

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Executar apenas inventario ou coletar previas sem gravar no banco?"
        type: choice
        options:
          - inventario
          - coletar
        default: inventario
        required: true
      lote:
        description: "Lote territorial (Capital somente no lote geral)"
        type: choice
        options:
          - geral
          - rmsp-norte
          - rmsp-leste
          - rmsp-sudeste
          - rmsp-sudoeste
          - rmsp-oeste
        default: geral
        required: true

permissions:
  contents: read

jobs:
  inventario-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      MODO: ${{ inputs.modo }}
      LOTE: ${{ inputs.lote }}
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventariar RMSP / gerar previas
        shell: bash
        run: |
          set -euo pipefail
          args=(--regiao rmsp --modo "$MODO" --saida relatorios/motor-regional)
          if [[ "$LOTE" != "geral" ]]; then
            args+=(--lote "$LOTE")
          fi
          python motor_regional.py "${args[@]}"
      - name: Anexar CSV e relatorios (inclusive falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-regional-${{ inputs.modo }}-${{ inputs.lote }}
          path: relatorios/motor-regional/
          if-no-files-found: warn
          retention-days: 14
